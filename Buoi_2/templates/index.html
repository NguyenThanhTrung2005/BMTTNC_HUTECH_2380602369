<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành An toàn thông tin nâng cao</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#0f172a,#1e3a8a);
            min-height:100vh;
            display:flex;
            align-items:center;
        }

        .main-card{
            border:none;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 15px 35px rgba(0,0,0,0.3);
        }

        .card-header-custom{
            background:#0d6efd;
            color:white;
            font-size:22px;
            font-weight:bold;
            text-align:center;
            padding:20px;
        }

        .logo{
            width:220px;
            display:block;
            margin:auto;
        }

        .algorithm-item{
            font-size:18px;
            font-weight:500;
            padding:18px 25px;
            transition:0.3s;
        }

        .algorithm-item:hover{
            background:#0d6efd;
            color:white;
            transform:translateX(10px);
        }

        .title{
            text-align:center;
            font-weight:bold;
            color:#1e293b;
            margin-top:20px;
            margin-bottom:20px;
        }

        .footer{
            text-align:center;
            color:#6c757d;
            margin-top:20px;
            font-size:14px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card main-card">

                <div class="card-body p-5">

                    <img src="https://file1.hutech.edu.vn/file/editor/homepage/stories/hinh34/logo%20CMYK-01.png"
                         alt="HUTECH"
                         class="logo">

                    <h2 class="title">
                        BÀI THỰC HÀNH BẢO MẬT THÔNG TIN NÂNG CAO
                    </h2>

                    <div class="card-header-custom mb-3">
                        DANH SÁCH THUẬT TOÁN MÃ HÓA
                    </div>

                    <div class="list-group">

                        <a href="/caesar"
                           class="list-group-item list-group-item-action algorithm-item">
                            🔐 Caesar Cipher
                        </a>

                        <a href="/playfair"
                           class="list-group-item list-group-item-action algorithm-item">
                            🔑 Playfair Cipher
                        </a>

                        <a href="/railfence"
                           class="list-group-item list-group-item-action algorithm-item">
                            🚆 Rail Fence Cipher
                        </a>

                        <a href="/vigenere"
                           class="list-group-item list-group-item-action algorithm-item">
                            🛡️ Vigenere Cipher
                        </a>

                    </div>

                    <div class="footer">
                        Khoa Công nghệ Thông tin - HUTECH
                    </div>
                    <div class="footer">
                        Nguyễn Thanh Trung - 2380602369
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
